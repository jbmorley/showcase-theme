---
layout: default
---

<header>
    <h1>Documentation</h1>
</header>

<div class="content-sidebar">
    <documentation-navigation class="tree">
        {% file_tree docs %}
    </documentation-navigation>
    <documentation-content>
        {% if page.title and page.shows_title %}
            <header>
                <h1>{{ page.title }}</h1>
            </header>
        {% endif %}
        <div class="toc">
            {{ content | toc_only }}
        </div>
        {{ content | inject_anchors }}
    </documentation-content>
</div>
